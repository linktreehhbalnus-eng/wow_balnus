function status(n){return n>=5?'OUTPERFORM':n===4?'ON TRACK':n===3?'WATCH':'CRITICAL'}
function kp(r,k,dp=0){let now=r[k+'_m'],prev=r[k+'_m1'];let growth=prev?(now-prev)/prev*100:null;return '<b>'+fmt(now,dp)+'</b><div class="sub '+(now>prev?'positive':now<prev?'negative':'')+'">('+fmt(prev,dp)+' / '+(growth===null?'—':(growth>=0?'+':'')+growth.toFixed(1).replace('.',',')+'%')+')</div>'}
